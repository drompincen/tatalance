<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reset Password — Tatalance</title>
    <link rel="stylesheet" href="/auth.css">
</head>
<body>
    <div class="login-card">
        <div class="auth-top">
            <div class="lang-toggle" id="langToggle" onclick="toggleLang()" data-i18n-title="lang.switch" title="Switch language / Cambiar idioma">
                <div class="lang-slider"></div>
                <span class="lang-option" data-lang="en">EN</span>
                <span class="lang-option" data-lang="es">ES</span>
            </div>
        </div>
        <h1 data-i18n="auth.forgot.title">Reset Password</h1>
        <p class="subtitle" data-i18n="auth.forgot.subtitle">Answer your security question to reset</p>

        <div id="msg-error" class="message message-error" role="alert"></div>
        <div id="msg-success" class="message message-success" role="status"></div>

        <form id="step-username">
            <div class="field">
                <label for="username" data-i18n="auth.forgot.username">Username</label>
                <input type="text" id="username" autocomplete="username"
                       autocapitalize="off" autocorrect="off" spellcheck="false" required>
            </div>
            <button type="submit" data-i18n="auth.forgot.next">Next</button>
        </form>

        <form id="step-reset" style="display:none">
            <div class="question-text" id="question-display"></div>
            <div class="field">
                <label for="answer" data-i18n="auth.forgot.yourAnswer">Your Answer</label>
                <input type="text" id="answer" autocomplete="off" required>
            </div>
            <div class="field">
                <label for="newPassword" data-i18n="auth.forgot.newPassword">New Password</label>
                <input type="password" id="newPassword" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="confirmPassword" data-i18n="auth.forgot.confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" autocomplete="new-password" required>
            </div>
            <button type="submit" data-i18n="auth.forgot.submit">Reset Password</button>
        </form>

        <p class="auth-footer">
            <a href="/login.html" data-i18n="auth.forgot.backToSignIn">Back to sign in</a>
        </p>
    </div>

    <script src="/js/i18n.js"></script>
    <script>
        function tf(k) {
            if (typeof t !== 'function') return null;
            var v = t(k);
            return (v && v !== k) ? v : null;
        }

        function refreshForgotPage() {
            var title = tf('auth.forgot.pageTitle');
            if (title) document.title = title;
            var nextBtn = document.querySelector('#step-username button[type=submit]');
            var resetBtn = document.querySelector('#step-reset button[type=submit]');
            var nextLabel = tf('auth.forgot.next');
            var resetLabel = tf('auth.forgot.submit');
            if (nextBtn && stepUsername.style.display !== 'none' && nextLabel) nextBtn.textContent = nextLabel;
            if (resetBtn && stepReset.style.display !== 'none' && resetLabel) resetBtn.textContent = resetLabel;
        }

        document.addEventListener('tatalance:langchange', refreshForgotPage);
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof applyI18n === 'function') applyI18n();
            refreshForgotPage();
        });

        var msgError = document.getElementById('msg-error');
        var msgSuccess = document.getElementById('msg-success');
        var stepUsername = document.getElementById('step-username');
        var stepReset = document.getElementById('step-reset');
        var savedUsername = '';

        function showError(msg) {
            msgError.textContent = msg;
            msgError.style.display = 'block';
            msgSuccess.style.display = 'none';
        }

        stepUsername.addEventListener('submit', async function(e) {
            e.preventDefault();
            msgError.style.display = 'none';
            var username = document.getElementById('username').value.trim();
            if (!username) { showError(tf('auth.forgot.usernameRequired')); return; }

            try {
                var res = await fetch('/api/users/forgot-password/question', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });
                var data = await res.json();
                if (!res.ok) { showError(data.message || tf('auth.forgot.accountNotFound')); return; }

                savedUsername = username;
                document.getElementById('question-display').textContent = data.question;
                stepUsername.style.display = 'none';
                stepReset.style.display = 'block';
                refreshForgotPage();
            } catch (err) {
                showError(tf('auth.forgot.serverError'));
            }
        });

        stepReset.addEventListener('submit', async function(e) {
            e.preventDefault();
            msgError.style.display = 'none';

            var answer = document.getElementById('answer').value.trim();
            var newPassword = document.getElementById('newPassword').value;
            var confirm = document.getElementById('confirmPassword').value;

            if (!answer) { showError(tf('auth.forgot.answerRequired')); return; }
            if (newPassword.length < 4) { showError(tf('auth.forgot.passwordMin')); return; }
            if (newPassword !== confirm) { showError(tf('auth.forgot.passwordsNoMatch')); return; }

            try {
                var res = await fetch('/api/users/forgot-password/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: savedUsername,
                        securityAnswer: answer,
                        newPassword: newPassword
                    })
                });
                var data = await res.json();
                if (!res.ok) { showError(data.message || tf('auth.forgot.resetFailed')); return; }

                msgSuccess.textContent = data.message;
                msgSuccess.style.display = 'block';
                stepReset.style.display = 'none';
                setTimeout(function() { window.location.href = '/login.html'; }, 1500);
            } catch (err) {
                showError(tf('auth.forgot.serverError'));
            }
        });
    </script>
</body>
</html>
