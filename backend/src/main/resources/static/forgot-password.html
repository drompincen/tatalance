<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reset Password — Tatalance</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            padding-top: calc(24px + env(safe-area-inset-top));
            padding-bottom: calc(24px + env(safe-area-inset-bottom));
        }
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 32px 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08);
            width: 100%;
            max-width: 360px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #4b5563;
            margin-bottom: 24px;
        }
        .field { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1.5px solid #cbd5e0;
            border-radius: 8px;
            background: #fafafa;
            color: #1a1a2e;
        }
        input:focus {
            outline: none;
            border-color: #0f3460;
            background: white;
            box-shadow: 0 0 0 3px rgba(15,52,96,.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background: #0f3460;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
            margin-top: 8px;
        }
        button:hover { background: #16213e; }
        button:active { background: #0a2440; }
        .message {
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }
        .message-error { background: #fee2e2; color: #991b1b; }
        .message-success { background: #d1fae5; color: #065f46; }
        .question-text {
            background: #f0f4ff;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            color: #1e3a8a;
            margin-bottom: 16px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Reset Password</h1>
        <p class="subtitle">Answer your security question to reset</p>

        <div id="msg-error" class="message message-error" role="alert"></div>
        <div id="msg-success" class="message message-success" role="status"></div>

        <!-- Step 1: enter username -->
        <form id="step-username">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username"
                       autocapitalize="off" autocorrect="off" spellcheck="false" required>
            </div>
            <button type="submit">Next</button>
        </form>

        <!-- Step 2: answer question + new password -->
        <form id="step-reset" style="display:none">
            <div class="question-text" id="question-display"></div>
            <div class="field">
                <label for="answer">Your Answer</label>
                <input type="text" id="answer" autocomplete="off" required>
            </div>
            <div class="field">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" autocomplete="new-password" required>
            </div>
            <button type="submit">Reset Password</button>
        </form>

        <p style="text-align:center;margin-top:16px;font-size:0.9rem;color:#4b5563">
            <a href="/login.html" style="color:#0f3460;font-weight:600">Back to sign in</a>
        </p>
    </div>

    <script>
        var msgError = document.getElementById('msg-error');
        var msgSuccess = document.getElementById('msg-success');
        var stepUsername = document.getElementById('step-username');
        var stepReset = document.getElementById('step-reset');
        var savedUsername = '';

        function showError(msg) {
            msgError.textContent = msg;
            msgError.style.display = 'block';
            msgSuccess.style.display = 'none';
        }

        stepUsername.addEventListener('submit', async function(e) {
            e.preventDefault();
            msgError.style.display = 'none';
            var username = document.getElementById('username').value.trim();
            if (!username) { showError('Username is required'); return; }

            try {
                var res = await fetch('/api/users/forgot-password/question', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });
                var data = await res.json();
                if (!res.ok) { showError(data.message || 'Account not found'); return; }

                savedUsername = username;
                document.getElementById('question-display').textContent = data.question;
                stepUsername.style.display = 'none';
                stepReset.style.display = 'block';
            } catch (err) {
                showError('Could not reach server');
            }
        });

        stepReset.addEventListener('submit', async function(e) {
            e.preventDefault();
            msgError.style.display = 'none';

            var answer = document.getElementById('answer').value.trim();
            var newPassword = document.getElementById('newPassword').value;
            var confirm = document.getElementById('confirmPassword').value;

            if (!answer) { showError('Answer is required'); return; }
            if (newPassword.length < 4) { showError('Password must be at least 4 characters'); return; }
            if (newPassword !== confirm) { showError('Passwords do not match'); return; }

            try {
                var res = await fetch('/api/users/forgot-password/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: savedUsername,
                        securityAnswer: answer,
                        newPassword: newPassword
                    })
                });
                var data = await res.json();
                if (!res.ok) { showError(data.message || 'Reset failed'); return; }

                msgSuccess.textContent = data.message;
                msgSuccess.style.display = 'block';
                stepReset.style.display = 'none';
                setTimeout(function() { window.location.href = '/login.html'; }, 1500);
            } catch (err) {
                showError('Could not reach server');
            }
        });
    </script>
</body>
</html>
