<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Rides — Tatalance</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5; color: #1a1a2e; min-height: 100dvh;
            padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
        }
        header {
            background: #1a1a2e; color: white; padding: 0 16px; height: 56px;
            display: flex; align-items: center; gap: 12px;
            position: sticky; top: 0; z-index: 100;
            padding-top: env(safe-area-inset-top);
        }
        header h1 { font-size: 1.1rem; font-weight: 700; }
        .subtitle { font-size: .8rem; color: rgba(255,255,255,.6); }
        .refresh-btn {
            margin-left: auto; background: none; border: 1px solid rgba(255,255,255,.3);
            color: white; padding: 6px 12px; border-radius: 6px; font-size: .8rem; cursor: pointer;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 16px 12px; }
        .date-group { margin-bottom: 20px; }
        .date-label {
            font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
            color: #6b7280; margin-bottom: 8px; padding-left: 4px;
        }
        .ride-card {
            background: white; border-radius: 10px; padding: 14px 16px; margin-bottom: 8px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: pointer; transition: box-shadow .15s;
        }
        .ride-card:active { box-shadow: 0 1px 6px rgba(0,0,0,.15); }
        .ride-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .ride-time { font-size: .95rem; font-weight: 700; }
        .ride-status {
            font-size: .72rem; font-weight: 600; padding: 3px 8px; border-radius: 10px;
        }
        .status-ASSIGNED { background: #f3e8ff; color: #805ad5; }
        .status-IN_PROGRESS { background: #fef3c7; color: #d97706; }
        .status-SCHEDULED { background: #dbeafe; color: #3182ce; }
        .ride-client { font-size: .9rem; font-weight: 600; margin-bottom: 4px; }
        .ride-route { font-size: .82rem; color: #6b7280; }
        .ride-route span { margin: 0 4px; }
        .empty { text-align: center; padding: 60px 24px; color: #6b7280; }
        .empty .icon { font-size: 2.5rem; margin-bottom: 12px; }

        /* Detail panel */
        .detail-panel {
            display: none; position: fixed; inset: 0; background: #f0f2f5; z-index: 200;
            overflow-y: auto; padding-bottom: env(safe-area-inset-bottom);
        }
        .detail-panel.open { display: block; }
        .detail-header {
            background: #1a1a2e; color: white; padding: 16px; display: flex; align-items: center; gap: 12px;
            position: sticky; top: 0; padding-top: calc(16px + env(safe-area-inset-top));
        }
        .back-btn { background: none; border: none; color: white; font-size: 1.3rem; cursor: pointer; padding: 4px; }
        .detail-body { padding: 16px; max-width: 600px; margin: 0 auto; }
        .detail-card { background: white; border-radius: 10px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { font-size: .8rem; color: #6b7280; font-weight: 600; }
        .detail-value { font-size: .88rem; font-weight: 500; text-align: right; }
        .action-btn {
            width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1rem;
            font-weight: 700; cursor: pointer; margin-top: 8px; transition: opacity .15s;
        }
        .action-btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-start { background: #d97706; color: white; }
        .btn-complete { background: #38a169; color: white; }
        .complete-fields { margin-top: 12px; }
        .complete-fields label { display: block; font-size: .8rem; font-weight: 600; color: #555; margin-bottom: 4px; margin-top: 10px; }
        .complete-fields input {
            width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px;
            font-size: 16px; background: #fafafa;
        }
        .complete-fields input:focus { outline: none; border-color: #0f3460; background: white; }
        .total-display { font-size: 1.1rem; font-weight: 700; text-align: center; margin: 12px 0; color: #1a1a2e; }
        .error-msg { color: #e53e3e; font-size: .85rem; text-align: center; margin-top: 8px; }
        .success-msg { color: #38a169; font-size: .85rem; text-align: center; margin-top: 8px; }
    </style>
</head>
<body>

<header>
    <h1>My Rides</h1>
    <span class="subtitle" id="driver-name"></span>
    <button class="refresh-btn" onclick="loadQueue()">Refresh</button>
</header>

<div class="container" id="queue"></div>

<div class="detail-panel" id="detail-panel">
    <div class="detail-header">
        <button class="back-btn" onclick="closeDetail()">&#8592;</button>
        <h1>Ride Details</h1>
    </div>
    <div class="detail-body" id="detail-body"></div>
</div>

<script>
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // Get driver ID from URL: /driver-queue.html?driver=DRIVER_ID
    const params = new URLSearchParams(window.location.search);
    const driverId = params.get('driver');

    if (!driverId) {
        document.getElementById('queue').innerHTML = '<div class="empty"><div class="icon">&#9888;</div><p>No driver ID in URL.<br>Use: ?driver=YOUR_ID</p></div>';
    }

    let rides = [];

    async function loadQueue() {
        if (!driverId) return;
        try {
            const resp = await fetch(`/api/drivers/${driverId}/rides`);
            if (!resp.ok) throw new Error();
            rides = await resp.json();
            rides.sort((a, b) => new Date(a.pickupDateTime) - new Date(b.pickupDateTime));

            // Load driver name
            const driverResp = await fetch(`/api/drivers/${driverId}`);
            if (driverResp.ok) {
                const driver = await driverResp.json();
                document.getElementById('driver-name').textContent = `${driver.firstName} ${driver.lastName}`;
            }

            renderQueue();
        } catch {
            document.getElementById('queue').innerHTML = '<div class="empty"><div class="icon">&#9888;</div><p>Cannot load rides</p></div>';
        }
    }

    function renderQueue() {
        const el = document.getElementById('queue');
        if (!rides.length) {
            el.innerHTML = '<div class="empty"><div class="icon">&#9989;</div><p>No upcoming rides</p></div>';
            return;
        }

        // Group by date
        const groups = {};
        const today = new Date().toLocaleDateString();
        rides.forEach(r => {
            const d = new Date(r.pickupDateTime);
            const label = d.toLocaleDateString() === today ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
            if (!groups[label]) groups[label] = [];
            groups[label].push(r);
        });

        el.innerHTML = Object.entries(groups).map(([label, rides]) => `
            <div class="date-group">
                <div class="date-label">${esc(label)}</div>
                ${rides.map(r => `
                    <div class="ride-card" onclick="openDetail('${r.id}')">
                        <div class="ride-top">
                            <span class="ride-time">${new Date(r.pickupDateTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                            <span class="ride-status status-${r.status}">${r.status.replace('_',' ')}</span>
                        </div>
                        <div class="ride-client">${esc(r.clientName)}</div>
                        <div class="ride-route">${esc(r.pickupLocation)}<span>→</span>${esc(r.dropoffLocation)}</div>
                    </div>
                `).join('')}
            </div>
        `).join('');
    }

    function openDetail(rideId) {
        const r = rides.find(x => x.id === rideId);
        if (!r) return;
        const panel = document.getElementById('detail-panel');
        const body = document.getElementById('detail-body');

        let actions = '';
        if (r.status === 'ASSIGNED') {
            actions = `<button class="action-btn btn-start" onclick="startRide('${r.id}')">Start Ride</button>`;
        } else if (r.status === 'IN_PROGRESS') {
            actions = `
                <div class="complete-fields">
                    <label>Tolls ($)</label>
                    <input type="number" id="cd-tolls" value="0" min="0" step="0.01" inputmode="decimal" onchange="updateTotal(${r.basePrice||0})">
                    <label>Parking ($)</label>
                    <input type="number" id="cd-parking" value="0" min="0" step="0.01" inputmode="decimal" onchange="updateTotal(${r.basePrice||0})">
                    <label>Additional ($)</label>
                    <input type="number" id="cd-additional" value="0" min="0" step="0.01" inputmode="decimal" onchange="updateTotal(${r.basePrice||0})">
                    <label>Description</label>
                    <input type="text" id="cd-desc" placeholder="Extra stop, waiting, etc.">
                </div>
                <div class="total-display">Total: $${Number(r.basePrice || 0).toFixed(2)}</div>
                <button class="action-btn btn-complete" onclick="completeRide('${r.id}',${r.basePrice||0})">Complete Ride</button>
            `;
        }

        body.innerHTML = `
            <div class="detail-card">
                <div class="detail-row"><span class="detail-label">Client</span><span class="detail-value">${esc(r.clientName)}</span></div>
                <div class="detail-row"><span class="detail-label">Pickup</span><span class="detail-value">${new Date(r.pickupDateTime).toLocaleString()}</span></div>
                <div class="detail-row"><span class="detail-label">From</span><span class="detail-value">${esc(r.pickupLocation)}</span></div>
                <div class="detail-row"><span class="detail-label">To</span><span class="detail-value">${esc(r.dropoffLocation)}</span></div>
                <div class="detail-row"><span class="detail-label">Base Price</span><span class="detail-value">$${r.basePrice || 0}</span></div>
                <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value"><span class="ride-status status-${r.status}">${r.status.replace('_',' ')}</span></span></div>
                ${r.notes ? `<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-value">${esc(r.notes)}</span></div>` : ''}
            </div>
            ${actions}
            <div id="detail-msg"></div>
        `;
        panel.classList.add('open');
    }

    function closeDetail() {
        document.getElementById('detail-panel').classList.remove('open');
    }

    function updateTotal(basePrice) {
        const tolls = Number(document.getElementById('cd-tolls')?.value || 0);
        const parking = Number(document.getElementById('cd-parking')?.value || 0);
        const additional = Number(document.getElementById('cd-additional')?.value || 0);
        const total = basePrice + tolls + parking + additional;
        const el = document.querySelector('.total-display');
        if (el) el.textContent = `Total: $${total.toFixed(2)}`;
    }

    async function startRide(rideId) {
        const msg = document.getElementById('detail-msg');
        try {
            const resp = await fetch(`/api/rides/${rideId}/start`, { method: 'POST' });
            if (!resp.ok) throw new Error((await resp.json()).message || 'Failed');
            msg.className = 'success-msg';
            msg.textContent = 'Ride started!';
            await loadQueue();
            setTimeout(() => openDetail(rideId), 300);
        } catch (e) {
            msg.className = 'error-msg';
            msg.textContent = 'Failed: ' + e.message;
        }
    }

    async function completeRide(rideId, basePrice) {
        const msg = document.getElementById('detail-msg');
        const tolls = Number(document.getElementById('cd-tolls')?.value || 0);
        const parking = Number(document.getElementById('cd-parking')?.value || 0);
        const additional = Number(document.getElementById('cd-additional')?.value || 0);
        const desc = document.getElementById('cd-desc')?.value || '';

        try {
            const resp = await fetch(`/api/rides/${rideId}/complete`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    actualStart: new Date().toISOString(),
                    actualEnd: new Date().toISOString(),
                    tolls, parking, additionalCharges: additional, chargeDescription: desc
                })
            });
            if (!resp.ok) throw new Error((await resp.json()).message || 'Failed');
            msg.className = 'success-msg';
            msg.textContent = 'Ride completed!';
            await loadQueue();
            setTimeout(closeDetail, 1000);
        } catch (e) {
            msg.className = 'error-msg';
            msg.textContent = 'Failed: ' + e.message;
        }
    }

    // Pull-to-refresh via touchstart/touchend
    let touchStart = 0;
    document.addEventListener('touchstart', e => { if (window.scrollY === 0) touchStart = e.touches[0].clientY; });
    document.addEventListener('touchend', e => {
        if (touchStart && e.changedTouches[0].clientY - touchStart > 100) loadQueue();
        touchStart = 0;
    });

    loadQueue();
</script>
</body>
</html>
