<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Queue — Tatalance</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1a1a2e;
            --muted: #4b5563;
            --line: #e2e8f0;
            --primary: #0f3460;
            --scheduled: #3182ce;
            --assigned: #805ad5;
            --in-progress: #d97706;
            --completed: #38a169;
            --cancelled: #e53e3e;
        }
        html, body { overflow-x: clip; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            font-size: 16px;
        }

        header {
            background: #1a1a2e;
            color: white;
            padding: 14px 16px;
        }
        header h1 {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        header .subtitle {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 2px;
        }

        main {
            padding: 16px;
            max-width: 720px;
            margin: 0 auto;
        }

        .day-heading {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            margin: 18px 4px 8px;
        }
        .day-heading:first-child { margin-top: 4px; }

        .ride-card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px 12px;
        }
        .ride-card.completed { opacity: 0.6; }

        .actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .action-btn {
            flex: 1;
            min-height: 44px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            padding: 12px;
        }
        .action-btn.primary { background: var(--primary); color: white; }
        .action-btn.primary:active { background: #0a2440; }
        .action-btn.complete { background: var(--completed); color: white; }
        .action-btn.complete:active { background: #2f855a; }

        .complete-form {
            grid-column: 1 / -1;
            margin-top: 10px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            border: 1px solid var(--line);
            display: none;
        }
        .complete-form.open { display: block; }
        .complete-form .row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .complete-form label {
            flex: 1;
            font-size: 0.9rem;
            color: var(--muted);
        }
        .complete-form input {
            width: 110px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid var(--line);
            border-radius: 6px;
            text-align: right;
        }
        .complete-form .total {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            padding-top: 8px;
            border-top: 1px solid var(--line);
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }
        .complete-form .confirm-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .complete-form .confirm-row button { flex: 1; }
        .action-btn.cancel { background: var(--line); color: var(--text); }
        .pickup-time {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }
        .client-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            grid-column: 1 / -1;
        }
        .route {
            font-size: 0.9rem;
            color: var(--muted);
            grid-column: 1 / -1;
            line-height: 1.4;
        }
        .arrow { color: #94a3b8; padding: 0 4px; }
        .stopwatch {
            grid-column: 1 / -1;
            font-size: 1.6rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--in-progress);
            letter-spacing: 1px;
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 12px;
            color: white;
            justify-self: end;
            align-self: start;
        }
        .badge-SCHEDULED   { background: var(--scheduled); }
        .badge-ASSIGNED    { background: var(--assigned); }
        .badge-IN_PROGRESS { background: var(--in-progress); }
        .badge-COMPLETED   { background: var(--completed); }
        .badge-CANCELLED   { background: var(--cancelled); }

        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: var(--muted);
        }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
        .empty-state p { font-size: 0.95rem; }

        .error-state {
            padding: 24px 16px;
            border-radius: 12px;
            background: #fee2e2;
            color: #991b1b;
            margin-top: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1 id="header-title">My Queue</h1>
        <div class="subtitle" id="header-subtitle">Today and upcoming rides</div>
    </header>

    <main id="content">
        <div class="empty-state" data-test="empty-state" id="empty-state" style="display:none">
            <div class="icon">🚘</div>
            <p>No rides assigned. Pull down to refresh.</p>
        </div>
        <div id="rides"></div>
    </main>

    <script>
        const esc = s => String(s ?? '').replace(/[&<>"']/g,
            c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

        const mapsLink = s => s ? `<a href="https://www.google.com/maps/search/${encodeURIComponent(s)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${esc(s)}</a>` : '—';

        const qs = new URLSearchParams(location.search);
        const driverId = qs.get('id') || '';

        function formatTime(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
        }
        function formatDateHeading(iso) {
            if (!iso) return 'Unscheduled';
            const d = new Date(iso);
            const today = new Date();
            const sameDay = d.toDateString() === today.toDateString();
            if (sameDay) return 'Today';
            return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function render(rides) {
            const empty = document.getElementById('empty-state');
            const container = document.getElementById('rides');
            container.innerHTML = '';

            if (!rides.length) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            // Group by day, preserving the server's ascending sort.
            const groups = new Map();
            for (const r of rides) {
                const key = formatDateHeading(r.pickupDateTime);
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(r);
            }

            for (const [day, dayRides] of groups) {
                const h = document.createElement('div');
                h.className = 'day-heading';
                h.textContent = day;
                container.appendChild(h);

                for (const r of dayRides) {
                    const card = document.createElement('article');
                    card.className = 'ride-card' + (r.status === 'COMPLETED' ? ' completed' : '');
                    card.setAttribute('data-test', 'ride-card');
                    card.setAttribute('data-ride-id', r.id);
                    card.innerHTML = `
                        <div class="pickup-time">${esc(formatTime(r.pickupDateTime))}</div>
                        <span class="status-badge badge-${esc(r.status)}" data-test="status-badge">${esc(r.status)}</span>
                        <div class="client-name">${esc(r.clientName || 'Unknown client')}</div>
                        <div class="route">${mapsLink(r.pickupLocation)} <span class="arrow">→</span> ${mapsLink(r.dropoffLocation)}</div>
                        ${r.status === 'IN_PROGRESS' && r.actualStart ? `<div class="stopwatch" data-start="${r.actualStart}">00:00:00</div>` : ''}
                        ${actionsFor(r)}
                        ${completeFormFor(r)}
                    `;
                    container.appendChild(card);
                }
            }
        }

        function actionsFor(r) {
            if (r.status === 'SCHEDULED' || r.status === 'ACCEPTED') {
                return `<div class="actions">
                    <button class="action-btn primary" data-test="start-btn"
                            onclick="startRide('${esc(r.id)}')">Start ride</button>
                </div>`;
            }
            if (r.status === 'IN_PROGRESS') {
                return `<div class="actions">
                    <button class="action-btn complete" data-test="complete-btn"
                            onclick="openCompleteForm('${esc(r.id)}')">Complete ride</button>
                </div>`;
            }
            return '';
        }

        function completeFormFor(r) {
            if (r.status !== 'IN_PROGRESS') return '';
            const base = Number(r.basePrice || 0);
            const mode = r.pricingMode || 'FLAT';
            const rate = Number(r.hourlyRate || 0);
            const rid = esc(r.id);
            let priceLabel = `Base price: $${base.toFixed(2)}`;
            if (mode === 'HOURLY') priceLabel = `Hourly rate: $${rate.toFixed(2)}/hr`;
            else if (mode === 'FLAT_PLUS_HOURLY') priceLabel = `$${base.toFixed(2)} flat + $${rate.toFixed(2)}/hr`;
            return `<div class="complete-form" data-test="complete-form" data-ride-id="${rid}" data-mode="${mode}" data-base="${base}" data-rate="${rate}" data-start="${r.actualStart || ''}">
                <div class="row"><label>${priceLabel}</label></div>
                ${mode !== 'FLAT' ? `<div class="row" style="font-size:.9rem;color:var(--in-progress);font-weight:600" id="time-cost-${rid}"></div>` : ''}
                <div class="row"><label for="tolls-${rid}">Tolls</label>
                    <input type="number" inputmode="decimal" step="0.01" min="0" value="0"
                           id="tolls-${rid}" oninput="recalcQueue('${rid}')"></div>
                <div class="row"><label for="parking-${rid}">Parking</label>
                    <input type="number" inputmode="decimal" step="0.01" min="0" value="0"
                           id="parking-${rid}" oninput="recalcQueue('${rid}')"></div>
                <div class="row"><label for="extras-${rid}">Extras</label>
                    <input type="number" inputmode="decimal" step="0.01" min="0" value="0"
                           id="extras-${rid}" oninput="recalcQueue('${rid}')"></div>
                <div class="total">
                    <span>Total billable</span>
                    <span data-test="billable" id="billable-${rid}">$${base.toFixed(2)}</span>
                </div>
                <div class="confirm-row">
                    <button class="action-btn cancel" onclick="closeCompleteForm('${esc(r.id)}')">Cancel</button>
                    <button class="action-btn complete" data-test="confirm-complete-btn"
                            onclick="submitComplete('${esc(r.id)}')">Confirm</button>
                </div>
            </div>`;
        }

        function readNumber(id) {
            const v = parseFloat(document.getElementById(id)?.value || '0');
            return Number.isFinite(v) ? v : 0;
        }

        function recalc(id, base) {
            const total = base + readNumber(`tolls-${id}`) + readNumber(`parking-${id}`) + readNumber(`extras-${id}`);
            const el = document.getElementById(`billable-${id}`);
            if (el) el.textContent = `$${total.toFixed(2)}`;
        }

        function recalcQueue(id) {
            const form = document.querySelector(`.complete-form[data-ride-id="${id}"]`);
            if (!form) return;
            const mode = form.dataset.mode;
            const base = Number(form.dataset.base) || 0;
            const rate = Number(form.dataset.rate) || 0;
            const startIso = form.dataset.start;
            const tolls = readNumber(`tolls-${id}`);
            const parking = readNumber(`parking-${id}`);
            const extras = readNumber(`extras-${id}`);
            let timeCost = 0;
            const tcEl = document.getElementById(`time-cost-${id}`);
            if (mode !== 'FLAT' && rate && startIso) {
                const mins = Math.round((Date.now() - new Date(startIso).getTime()) / 60000);
                if (mins > 0) {
                    timeCost = (mins / 60) * rate;
                    const h = Math.floor(mins / 60);
                    const m = mins % 60;
                    const dur = (h > 0 ? h + 'h ' : '') + m + 'm';
                    if (tcEl) tcEl.textContent = `${dur} @ $${rate.toFixed(2)}/hr = $${timeCost.toFixed(2)}`;
                }
            }
            let subtotal = mode === 'FLAT' ? base : mode === 'FLAT_PLUS_HOURLY' ? base + timeCost : timeCost;
            const total = subtotal + tolls + parking + extras;
            const el = document.getElementById(`billable-${id}`);
            if (el) el.textContent = `$${total.toFixed(2)}`;
        }

        function openCompleteForm(id) {
            document.querySelector(`.complete-form[data-ride-id="${id}"]`)?.classList.add('open');
        }
        function closeCompleteForm(id) {
            document.querySelector(`.complete-form[data-ride-id="${id}"]`)?.classList.remove('open');
        }

        function startRide(id) {
            fetch(`/api/rides/${encodeURIComponent(id)}/start`, { method: 'POST' })
                .then(r => { if (!r.ok) throw new Error(`start failed: ${r.status}`); return r.json(); })
                .then(loadQueue)
                .catch(err => alert(err.message));
        }

        function submitComplete(id) {
            const body = {
                tolls: readNumber(`tolls-${id}`),
                parking: readNumber(`parking-${id}`),
                additionalCharges: readNumber(`extras-${id}`),
            };
            fetch(`/api/rides/${encodeURIComponent(id)}/complete`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            })
                .then(r => { if (!r.ok) throw new Error(`complete failed: ${r.status}`); return r.json(); })
                .then(loadQueue)
                .catch(err => alert(err.message));
        }

        function loadDriverHeader() {
            if (!driverId) return;
            fetch(`/api/drivers/${encodeURIComponent(driverId)}`)
                .then(r => r.ok ? r.json() : null)
                .then(d => {
                    if (!d) return;
                    document.getElementById('header-title').textContent =
                        `${d.firstName || ''} ${d.lastName || ''}`.trim() || 'My Queue';
                    document.getElementById('header-subtitle').textContent =
                        d.vehicle ? d.vehicle : 'Today and upcoming rides';
                })
                .catch(() => {});
        }

        function loadQueue() {
            if (!driverId) {
                document.getElementById('empty-state').style.display = 'block';
                return;
            }
            fetch(`/api/drivers/${encodeURIComponent(driverId)}/rides`)
                .then(r => r.json())
                .then(render)
                .catch(() => {
                    document.getElementById('rides').innerHTML =
                        '<div class="error-state">Could not load your queue. Pull down to retry.</div>';
                });
        }

        function tickStopwatches() {
            document.querySelectorAll('.stopwatch[data-start]').forEach(el => {
                const start = new Date(el.dataset.start).getTime();
                const elapsed = Math.max(0, Math.floor((Date.now() - start) / 1000));
                const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
                const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
                const s = String(elapsed % 60).padStart(2, '0');
                el.textContent = `${h}:${m}:${s}`;
            });
            document.querySelectorAll('.complete-form.open').forEach(form => {
                const id = form.dataset.rideId;
                if (id) recalcQueue(id);
            });
        }

        loadDriverHeader();
        loadQueue();
        setInterval(loadQueue, 15000);
        setInterval(tickStopwatches, 1000);
    </script>
</body>
</html>
