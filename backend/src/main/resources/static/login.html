<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign in — Tatalance</title>
    <link rel="stylesheet" href="/auth.css">
</head>
<body class="scrollable">
    <div class="login-card">
        <div class="auth-top">
            <div class="lang-toggle" id="langToggle" onclick="toggleLang()" data-i18n-title="lang.switch" title="Switch language / Cambiar idioma">
                <div class="lang-slider"></div>
                <span class="lang-option" data-lang="en">EN</span>
                <span class="lang-option" data-lang="es">ES</span>
            </div>
        </div>
        <h1 data-i18n="auth.login.title">Sign in</h1>
        <p class="subtitle" data-i18n="auth.login.subtitle">Tatalance — chauffeur platform demo</p>

        <div id="msg-error" class="message message-error" role="alert" data-i18n="auth.login.wrongCredentials">
            Wrong username or password.
        </div>
        <div id="msg-info" class="message message-info" role="status" data-i18n="auth.login.signedOut">
            You have been signed out.
        </div>

        <form method="post" action="/login" novalidate>
            <div class="field">
                <label for="username" data-i18n="auth.login.username">Username</label>
                <input type="text"
                       id="username"
                       name="username"
                       autocomplete="username"
                       autocapitalize="off"
                       autocorrect="off"
                       inputmode="text"
                       spellcheck="false"
                       required>
            </div>
            <div class="field">
                <label for="password" data-i18n="auth.login.password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       autocomplete="current-password"
                       required>
            </div>
            <button type="submit" data-i18n="auth.login.submit">Sign in</button>
        </form>
        <p class="auth-footer" style="margin-top:12px">
            <a href="/forgot-password.html" data-i18n="auth.login.forgotPassword">Forgot password?</a>
        </p>
        <div id="google-section" style="display:none">
            <div class="divider" data-i18n="auth.login.or">or</div>
            <a href="/oauth2/authorization/google" id="google-link" style="text-decoration:none">
                <button type="button" class="google-btn">
                    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.006 24.006 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    <span data-i18n="auth.login.googleSignIn">Sign in with Google</span>
                </button>
            </a>
        </div>
        <p class="auth-footer">
            <span data-i18n="auth.login.noAccount">Don't have an account?</span>
            <a href="/register.html" data-i18n="auth.login.createOne">Create one</a>
        </p>
    </div>

    <script src="/js/i18n.js"></script>
    <script>
        function tf(k) { return typeof t === 'function' ? t(k) : k; }

        function refreshLoginPage() {
            document.title = tf('auth.login.pageTitle');
            var msgError = document.getElementById('msg-error');
            var msgInfo = document.getElementById('msg-info');
            if (msgError.style.display === 'block') {
                msgError.textContent = tf('auth.login.wrongCredentials');
            }
            if (msgInfo.style.display === 'block') {
                msgInfo.textContent = tf('auth.login.signedOut');
            }
            var btn = document.querySelector('form button[type=submit]');
            if (btn && !btn.disabled) btn.textContent = tf('auth.login.submit');
        }

        document.addEventListener('tatalance:langchange', refreshLoginPage);
        document.addEventListener('DOMContentLoaded', refreshLoginPage);

        function getCsrfToken() {
            var m = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
            return m ? decodeURIComponent(m[1]) : null;
        }

        var qs = new URLSearchParams(location.search);
        if (qs.has('error'))  document.getElementById('msg-error').style.display = 'block';
        if (qs.has('logout')) document.getElementById('msg-info').style.display  = 'block';

        fetch('/api/info').then(function(r) { return r.json(); }).then(function(info) {
            if (info.googleOAuthEnabled) {
                document.getElementById('google-section').style.display = 'block';
            }
        }).catch(function() {});

        var form = document.querySelector('form');
        var btn = form.querySelector('button');
        var msgError = document.getElementById('msg-error');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = tf('auth.login.submitting');
            msgError.style.display = 'none';

            var formData = new URLSearchParams();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);
            var csrf = getCsrfToken();
            if (csrf) formData.append('_csrf', csrf);

            var headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
            if (csrf) headers['X-XSRF-TOKEN'] = csrf;

            try {
                var res = await fetch('/login', {
                    method: 'POST',
                    headers: headers,
                    body: formData.toString(),
                    redirect: 'follow',
                    credentials: 'same-origin'
                });
                if (res.url && res.url.includes('error')) {
                    msgError.textContent = tf('auth.login.wrongCredentials');
                    msgError.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = tf('auth.login.submit');
                    return;
                }
                try {
                    var me = await fetch('/api/users/me', { credentials: 'same-origin' });
                    if (me.ok) {
                        var profile = await me.json();
                        window.location.href = profile.businessMode === 'FREELANCE' ? '/freelance.html' : '/index.html';
                        return;
                    }
                } catch (err) { /* fall through */ }
                window.location.href = '/index.html';
            } catch (err) {
                msgError.textContent = tf('auth.login.serverError');
                msgError.style.display = 'block';
                btn.disabled = false;
                btn.textContent = tf('auth.login.submit');
            }
        });
    </script>
</body>
</html>
