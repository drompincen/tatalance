<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign in — Tatalance</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            padding-top: calc(24px + env(safe-area-inset-top));
            padding-bottom: calc(24px + env(safe-area-inset-bottom));
        }
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 32px 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08);
            width: 100%;
            max-width: 360px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #4b5563;
            margin-bottom: 24px;
        }
        .field { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1.5px solid #cbd5e0;
            border-radius: 8px;
            background: #fafafa;
            color: #1a1a2e;
        }
        input:focus {
            outline: none;
            border-color: #0f3460;
            background: white;
            box-shadow: 0 0 0 3px rgba(15,52,96,.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background: #0f3460;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
            margin-top: 8px;
        }
        button:hover { background: #16213e; }
        button:active { background: #0a2440; }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #9ca3af;
            font-size: 0.85rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }
        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }
        .google-btn {
            background: white;
            color: #374151;
            border: 1.5px solid #cbd5e0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 0;
        }
        .google-btn:hover { background: #f9fafb; border-color: #9ca3af; }
        .google-btn:active { background: #f3f4f6; }
        .google-btn svg { flex-shrink: 0; }
        @media (max-height: 500px) {
            body { align-items: flex-start; padding-top: 16px; }
        }
        .message {
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }
        .message-error { background: #fee2e2; color: #991b1b; }
        .message-info { background: #dbeafe; color: #1e3a8a; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Sign in</h1>
        <p class="subtitle">Tatalance — chauffeur platform demo</p>

        <div id="msg-error" class="message message-error" role="alert">
            Wrong username or password.
        </div>
        <div id="msg-info" class="message message-info" role="status">
            You have been signed out.
        </div>

        <form method="post" action="/login" novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       name="username"
                       autocomplete="username"
                       autocapitalize="off"
                       autocorrect="off"
                       inputmode="text"
                       spellcheck="false"
                       required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       autocomplete="current-password"
                       required>
            </div>
            <button type="submit">Sign in</button>
        </form>
        <p style="text-align:center;margin-top:12px;font-size:0.9rem">
            <a href="/forgot-password.html" style="color:#0f3460;font-weight:600">Forgot password?</a>
        </p>
        <div id="google-section" style="display:none">
            <div class="divider">or</div>
            <a href="/oauth2/authorization/google" id="google-link" style="text-decoration:none">
                <button type="button" class="google-btn">
                    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.006 24.006 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    Sign in with Google
                </button>
            </a>
        </div>
        <p style="text-align:center;margin-top:12px;font-size:0.9rem;color:#4b5563">
            Don't have an account? <a href="/register.html" style="color:#0f3460;font-weight:600">Create one</a>
        </p>
    </div>

    <script>
        function getCsrfToken() {
            var m = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
            return m ? decodeURIComponent(m[1]) : null;
        }

        var qs = new URLSearchParams(location.search);
        if (qs.has('error'))  document.getElementById('msg-error').style.display = 'block';
        if (qs.has('logout')) document.getElementById('msg-info').style.display  = 'block';

        fetch('/api/info').then(function(r) { return r.json(); }).then(function(info) {
            if (info.googleOAuthEnabled) {
                document.getElementById('google-section').style.display = 'block';
            }
        }).catch(function() {});

        var form = document.querySelector('form');
        var btn = form.querySelector('button');
        var msgError = document.getElementById('msg-error');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = 'Signing in\u2026';
            msgError.style.display = 'none';

            var formData = new URLSearchParams();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            var headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
            var csrf = getCsrfToken();
            if (csrf) headers['X-XSRF-TOKEN'] = csrf;

            try {
                var res = await fetch('/login', {
                    method: 'POST',
                    headers: headers,
                    body: formData.toString(),
                    redirect: 'follow',
                    credentials: 'same-origin'
                });
                if (res.url && res.url.includes('error')) {
                    msgError.textContent = 'Wrong username or password.';
                    msgError.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Sign in';
                    return;
                }
                try {
                    var me = await fetch('/api/users/me', { credentials: 'same-origin' });
                    if (me.ok) {
                        var profile = await me.json();
                        window.location.href = profile.businessMode === 'FREELANCE' ? '/freelance.html' : '/index.html';
                        return;
                    }
                } catch (e) { /* fall through */ }
                window.location.href = '/freelance.html';
            } catch (err) {
                msgError.textContent = 'Could not reach server. Try again.';
                msgError.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
