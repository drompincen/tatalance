<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Create Account — Tatalance</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            padding-top: calc(24px + env(safe-area-inset-top));
            padding-bottom: calc(24px + env(safe-area-inset-bottom));
        }
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 32px 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08);
            width: 100%;
            max-width: 360px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #4b5563;
            margin-bottom: 24px;
        }
        .field { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1.5px solid #cbd5e0;
            border-radius: 8px;
            background: #fafafa;
            color: #1a1a2e;
        }
        input:focus {
            outline: none;
            border-color: #0f3460;
            background: white;
            box-shadow: 0 0 0 3px rgba(15,52,96,.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background: #0f3460;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
            margin-top: 8px;
        }
        button:hover { background: #16213e; }
        button:active { background: #0a2440; }
        .message {
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }
        .message-error { background: #fee2e2; color: #991b1b; }
        .message-success { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Create Account</h1>
        <p class="subtitle">Tatalance — chauffeur platform</p>

        <div id="msg-error" class="message message-error" role="alert"></div>
        <div id="msg-success" class="message message-success" role="status"></div>

        <form id="register-form" novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       autocomplete="username"
                       autocapitalize="off"
                       autocorrect="off"
                       inputmode="text"
                       spellcheck="false"
                       required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       autocomplete="new-password"
                       required>
            </div>
            <div class="field">
                <label for="confirm">Confirm Password</label>
                <input type="password"
                       id="confirm"
                       autocomplete="new-password"
                       required>
            </div>
            <div class="field">
                <label for="securityQuestion">Security Question <span style="font-weight:400;color:#6b7280">(optional — for password recovery)</span></label>
                <select id="securityQuestion" style="width:100%;padding:12px;font-size:16px;border:1.5px solid #cbd5e0;border-radius:8px;background:#fafafa;color:#1a1a2e">
                    <option value="">— none —</option>
                    <option>What is your pet's name?</option>
                    <option>What city were you born in?</option>
                    <option>What is your favorite food?</option>
                    <option>What was your first car?</option>
                    <option>What is your mother's maiden name?</option>
                </select>
            </div>
            <div class="field" id="answer-field" style="display:none">
                <label for="securityAnswer">Your Answer</label>
                <input type="text" id="securityAnswer" autocomplete="off">
            </div>
            <button type="submit">Create Account</button>
        </form>
        <p style="text-align:center;margin-top:16px;font-size:0.9rem;color:#4b5563">
            Already have an account? <a href="/login.html" style="color:#0f3460;font-weight:600">Sign in</a>
        </p>
    </div>

    <script>
        var form = document.getElementById('register-form');
        var msgError = document.getElementById('msg-error');
        var msgSuccess = document.getElementById('msg-success');
        var secQ = document.getElementById('securityQuestion');
        var ansField = document.getElementById('answer-field');

        secQ.addEventListener('change', function() {
            ansField.style.display = secQ.value ? 'block' : 'none';
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            msgError.style.display = 'none';
            msgSuccess.style.display = 'none';

            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var confirm = document.getElementById('confirm').value;

            if (!username) { showError('Username is required'); return; }
            if (password.length < 4) { showError('Password must be at least 4 characters'); return; }
            if (password !== confirm) { showError('Passwords do not match'); return; }

            var payload = { username: username, password: password };
            if (secQ.value) {
                var answer = document.getElementById('securityAnswer').value.trim();
                if (!answer) { showError('Please provide an answer to the security question'); return; }
                payload.securityQuestion = secQ.value;
                payload.securityAnswer = answer;
            }

            try {
                var res = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                var data = await res.json();
                if (!res.ok) { showError(data.message || 'Registration failed'); return; }
                msgSuccess.textContent = data.message || 'Account created!';
                msgSuccess.style.display = 'block';
                form.reset();
                setTimeout(function() { window.location.href = '/login.html'; }, 1500);
            } catch (err) {
                showError('Could not reach server');
            }
        });

        function showError(msg) {
            msgError.textContent = msg;
            msgError.style.display = 'block';
        }
    </script>
</body>
</html>
