name: Deploy

on:
  push:
    branches: [main, drom, luciano]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'qa'
        type: choice
        options: [drom, luciano, qa, prod]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Run tests with JaCoCo coverage (gate on verify phase)
        run: |
          set +H
          cd backend && mvn clean test -B --no-transfer-progress '-Dmaven.javadoc.skip=true' -P-dev -Dtest='!**/*IntegrationTest' -DfailIfNoTests=false && mvn jacoco:report jacoco:check -B --no-transfer-progress '-Dmaven.javadoc.skip=true'

      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Build JAR
        run: cd backend && mvn package -DskipTests -P-dev

      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/target/tatalance-*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'qa' || github.ref_name) }}
    permissions:
      id-token: write
      contents: read
    env:
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'qa' || github.ref_name) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Wait for environment to be Ready
        run: |
          for i in $(seq 1 20); do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --application-name tatalance \
              --environment-names tatalance-${{ env.TARGET_ENV }} \
              --query "Environments[0].Status" --output text)
            echo "Status: $STATUS"
            [ "$STATUS" = "Ready" ] && break
            sleep 15
          done

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ env.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ env.AWS_SESSION_TOKEN }}
          application_name: tatalance
          environment_name: tatalance-${{ env.TARGET_ENV }}
          region: us-east-1
          version_label: ${{ github.sha }}-${{ env.TARGET_ENV }}
          deployment_package: tatalance-0.0.1-SNAPSHOT.jar
          wait_for_environment_recovery: 120

  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    # E2E can be flaky on fresh deploys (cold JVM + EB startup). Do not fail the overall pipeline status.
    # Deploy success is what matters for feature branches like drom.
    continue-on-error: true
    env:
      E2E_BASE_URL: http://tatalance-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'qa' || github.ref_name) }}.eba-7u2dj39y.us-east-1.elasticbeanstalk.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install E2E dependencies
        run: cd tests/e2e && npm ci

      - name: Install Playwright browsers
        run: cd tests/e2e && npx playwright install chromium --with-deps

      - name: Wait for app to be responsive (post-deploy)
        run: |
          for i in $(seq 1 30); do
            if curl -sf --max-time 5 "$E2E_BASE_URL/api/info" > /dev/null 2>&1 || curl -sf --max-time 5 "$E2E_BASE_URL/index.html" > /dev/null 2>&1; then
              echo "App responded on attempt $i"
              break
            fi
            echo "Waiting for app... ($i)"
            sleep 10
          done

      - name: Run E2E tests
        run: cd tests/e2e && npx playwright test --retries=1 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: tests/e2e/test-results/
